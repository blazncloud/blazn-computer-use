name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Build (full compiler output)
        # Preflight truncates build output in its JSON report; a bare build
        # step keeps the real compiler/linker error visible in the CI log.
        run: swift build
      - name: Preflight (no GUI/TCC)
        # GUI-dependent paths (AX, ScreenCaptureKit, overlay) need a logged-in
        # desktop session and TCC grants, so hosted CI stays on the pure,
        # non-mutating path.
        run: python3 scripts/preflight.py
