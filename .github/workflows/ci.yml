name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: swift build
      - name: Unit tests
        # GUI-dependent paths (AX, ScreenCaptureKit, overlay) need a logged-in
        # desktop session and TCC grants, so CI covers the pure logic only.
        run: swift test
      - name: CLI smoke (no GUI/TCC)
        # Keep hosted CI deterministic: do not open apps, prompt for TCC, or
        # exercise live input/capture paths here.
        run: |
          .build/debug/computer-use-mcp version
          .build/debug/computer-use-mcp help
